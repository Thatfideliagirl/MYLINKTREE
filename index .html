<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Fidelia's Link Tree</title>
<meta name="description" content="Strategy. Systems. Results. All of Fidelia Joseph's links in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap">
<style>
/* Layout: a welcome screen first, then one phone-width column styled as a music player: spinning record with her photo as the label, a playlist of songs (links), and a now-playing bar pinned to the bottom. */
:root{
  /* palette "cocoa" (default) */
  --bg:#1a1210; --bg2:#2b1d18; --card:#2d201b; --line:#44332b;
  --fg:#f8ede6; --muted:#bba59a; --accent:#f3c7bf; --accent-ink:#2a1713; --sand:#d6b493;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
[data-palette="blush"]{--bg:#f8ece5; --bg2:#f0d9ce; --card:#fffaf6; --line:#e7d0c5; --fg:#2e1d18; --muted:#7a6055; --accent:#a94a43; --accent-ink:#fff8f4; --sand:#a67a55; color-scheme:light}
[data-palette="sand"]{--bg:#d9c1a4; --bg2:#c8a985; --card:#e8d5bd; --line:#bb9c79; --fg:#2a1b13; --muted:#5d4636; --accent:#3a2217; --accent-ink:#f7e8da; --sand:#6b4a33; color-scheme:light}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.45;color:var(--fg);
  background:var(--bg) linear-gradient(180deg,var(--bg2),var(--bg) 520px) no-repeat;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 120px}
.col{max-width:460px;margin:0 auto;display:grid;gap:26px}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
button{font:inherit;color:inherit}

/* top row */
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:8px}
.dots button{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.dots button[aria-pressed="true"]{border-color:var(--fg)}

/* record: only the disc spins; her photo stays upright in the centre */
.stage{position:relative;width:min(100%,340px);aspect-ratio:1/1;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 30px 50px -20px rgba(0,0,0,.65),0 0 0 1px var(--line)}
.disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:repeating-radial-gradient(circle,#0b0706 0 2px,#1e1512 2px 4px);display:grid;place-items:center}
.stage>img{position:absolute;z-index:1;left:22%;top:22%;width:56%;height:56%;border-radius:50%;object-fit:cover;object-position:50% 24%;display:block;box-shadow:0 0 0 5px var(--accent),0 0 0 7px #0b0706}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,255,255,.16),transparent 16%,rgba(255,255,255,.1) 33%,transparent 50%,rgba(255,255,255,.16) 66%,transparent 83%,rgba(255,255,255,.1))}
body.playing .disc{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* hero */
.hero{display:grid;gap:10px}
.hero h1{margin:0;font:400 clamp(40px,11vw,54px)/.98 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.tag3{display:flex;flex-wrap:wrap;gap:6px 10px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.hero p{margin:0;color:var(--muted);max-width:40ch}
.play{display:flex;align-items:center;gap:14px;margin-top:6px}
.pbtn{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;
  box-shadow:0 10px 24px -8px var(--accent);transition:transform .15s}
.pbtn:hover{transform:scale(1.08)}
.pbtn svg{width:24px;height:24px;margin-left:3px}
.play small{display:block;color:var(--muted);font-size:12px}
.play b{font-size:16px}

/* playlist */
.sec{display:grid;gap:6px}
.sec h2{margin:0 0 4px;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.trk{display:grid;grid-template-columns:22px 44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 8px;border-radius:14px;
  transition:background .15s,transform .2s cubic-bezier(.3,1.5,.5,1)}
.trk:hover,.trk:focus-visible{background:var(--card);transform:translateX(4px)}
.trk:active{transform:scale(.98)}
.no{font-size:13px;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.no .pl{display:none;width:15px;height:15px;color:var(--accent)}
.no .eq{display:none}
.trk:not(.on):hover .no .num,.trk:not(.on):focus-visible .no .num{display:none}
.trk:not(.on):hover .no .pl,.trk:not(.on):focus-visible .no .pl{display:block}
.trk.on .no .num{display:none}.trk.on .no .eq{display:flex}
.ic{width:44px;height:44px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.ic svg{width:21px;height:21px}
.trk:hover .ic,.trk:focus-visible .ic{animation:wig .45s ease}
@keyframes wig{25%{transform:rotate(-8deg) scale(1.08)}60%{transform:rotate(6deg) scale(1.08)}}
.tx{min-width:0}
.tx b{display:block;font-size:15.5px;font-weight:700;overflow-wrap:anywhere}
.tx small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.go{display:flex;align-items:center;gap:9px}
.pill{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.pb{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--fg);transition:background .15s,color .15s,border-color .15s,transform .2s cubic-bezier(.3,1.8,.5,1)}
.pb svg{width:14px;height:14px;margin-left:2px}
.trk:hover .pb,.trk:focus-visible .pb{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:scale(1.14)}
.st{display:none;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.trk.on .st{display:inline}.trk.on .pb{display:none}
.trk.on .tx b{color:var(--accent)}
.eq{gap:2px;align-items:flex-end;height:14px;justify-content:center}
.eq i{width:3px;background:var(--accent);border-radius:2px;transform-origin:bottom;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
body.playing .eq i{animation-play-state:running}
.eq i:nth-child(1){height:60%}.eq i:nth-child(2){height:100%;animation-delay:-.4s}.eq i:nth-child(3){height:45%;animation-delay:-.7s}
@keyframes eq{50%{transform:scaleY(.4)}}

/* now playing bar */
.np{position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,var(--bg) 40%)}
.np a{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 10px;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.np img{width:42px;height:42px;border-radius:8px;object-fit:cover;object-position:50% 22%;flex:none}
.np div{min-width:0;flex:1}.np small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.np b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np span{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;flex:none}
.foot{text-align:center;color:var(--muted);font-size:12px}

/* welcome screen */
.wel{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px));
  background:var(--bg) linear-gradient(180deg,var(--bg2),var(--bg));transition:opacity .6s ease,visibility .6s}
.wel.out{opacity:0;visibility:hidden}
.wel .in{display:grid;gap:12px;justify-items:center;text-align:center;max-width:360px}
.wel .mini{width:132px;height:132px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px var(--card),0 0 0 7px var(--line),0 24px 40px -16px rgba(0,0,0,.6)}
.wel .mini img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.wel small{margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.wel h1{margin:0;font:400 clamp(42px,12vw,56px)/1 var(--serif);text-wrap:balance}
.wel .t3{color:var(--sand);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.wbtn{margin-top:14px;display:grid;justify-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:6px;font-weight:700;font-size:14px;color:var(--fg)}
.wbtn i{position:relative;width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 14px 30px -10px var(--accent);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.wbtn i::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 2s ease-out infinite}
.wbtn:hover i{transform:scale(1.1)}
.wbtn svg{width:28px;height:28px;margin-left:4px}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}

@media (prefers-reduced-motion:reduce){
  .eq i,body.playing .disc,.wbtn i::after,.trk:hover .ic{animation:none}
  .trk,.pb,.pbtn,.wbtn i,.wel{transition:none}
}
</style>
</head>

    book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/>',
    chat:'<path d="M4 20l1.4-4.2A8 8 0 1 1 8.3 18.7z"/>',
    linkedin:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-7M12 13a3 3 0 0 1 6 0v4"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>',
    link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    store:'<path d="M4 9l1.5-5h13L20 9M4 9h16v11H4zM4 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 4 0"/>'
  };
  var PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
  function svg(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||ICONS.link)+'</svg>'}
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
  function txt(tag,cls,t){var e=el(tag,cls);e.textContent=t;return e}
  function setLink(a,url){a.href=url;if(/^https?:/.test(url)){a.target='_blank';a.rel='noopener'}else{a.removeAttribute('target');a.removeAttribute('rel')}}

  var pal=S.palette;
  try{var saved=localStorage.getItem('links-palette');if(saved&&S.showPaletteSwitch)pal=saved}catch(e){}
  document.documentElement.setAttribute('data-palette',pal);

  var all=[];S.sections.forEach(function(s){s.links.forEach(function(l){all.push(l)})});
  var feat=all.filter(function(l){return l.id===S.featured})[0]||all[0];

  function setPlaying(l){
    Object.keys(rows).forEach(function(k){rows[k].classList.toggle('on',k===l.id)});
    document.body.classList.add('playing');
    setLink(barA,l.url);barT.textContent=l.title;barB.textContent=l.tag==='Free'?'Book free':'Open';
  }

  /* top row */
  var top=el('div','top');top.appendChild(txt('span','','Playlist · '+all.length+' songs'));
  if(S.showPaletteSwitch){
    var dots=el('div','dots');
    [['cocoa','#2b1d18'],['blush','#f0d9ce'],['sand','#c8a985']].forEach(function(p){
      var b=el('button');b.type='button';b.style.background=p[1];b.setAttribute('aria-label',p[0]+' colours');b.setAttribute('aria-pressed',p[0]===pal);
      b.onclick=function(){pal=p[0];document.documentElement.setAttribute('data-palette',pal);
        try{localStorage.setItem('links-palette',pal)}catch(e){}
        dots.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})};
      dots.appendChild(b)});
    top.appendChild(dots);
  }
  app.appendChild(top);

  /* cover + vinyl */
  var st=el('div','stage');var dc=el('div','disc');var im=el('img');im.src=S.photo;im.alt=S.name;im.width=400;im.height=400;st.appendChild(dc);st.appendChild(im);app.appendChild(st);

  /* hero */
  var hero=el('div','hero');
  hero.appendChild(txt('h1','',S.name));
  var t3=el('div','tag3');S.tagline.forEach(function(w){t3.appendChild(txt('span','',w))});hero.appendChild(t3);
  hero.appendChild(txt('p','',S.bio));
  var pl=el('div','play');var pb=el('a','pbtn',PLAY);
  setLink(pb,feat.url);pb.setAttribute('aria-label','Play '+feat.title);pb.addEventListener('click',function(){setPlaying(feat)});pl.appendChild(pb);
  var pt=el('div');pt.appendChild(txt('small','','Start here'));pt.appendChild(txt('b','',feat.title));pl.appendChild(pt);
  hero.appendChild(pl);app.appendChild(hero);

  /* playlist */
  var n=0;
  S.sections.forEach(function(s){
    var sec=el('section','sec');sec.appendChild(txt('h2','',s.title));
    s.links.forEach(function(l){
      n++;var a=el('a','trk');setLink(a,l.url);rows[l.id]=a;
      a.setAttribute('aria-label','Play '+l.title);
      var no=el('span','no');no.appendChild(txt('span','num',String(n)));no.insertAdjacentHTML('beforeend',PLAY.replace('<svg','<svg class="pl"'));no.appendChild(el('span','eq','<i></i><i></i><i></i>'));a.appendChild(no);
      a.appendChild(el('span','ic',svg(l.icon)));
      var tx=el('span','tx');tx.appendChild(txt('b','',l.title));if(l.subtitle)tx.appendChild(txt('small','',l.subtitle));a.appendChild(tx);
      var go=el('span','go');if(l.tag)go.appendChild(txt('span','pill',l.tag));
      if(!l.tag)go.appendChild(txt('span','st','Playing'));go.appendChild(el('span','pb',PLAY));a.appendChild(go);
      a.addEventListener('click',function(){setPlaying(l)});
      sec.appendChild(a);
    });
    app.appendChild(sec);
  });
  app.appendChild(txt('div','foot','© '+new Date().getFullYear()+' '+S.name));

  /* now playing bar */
  var np=el('div','np');barA=el('a');
  var ni=el('img');ni.src=S.photo;ni.alt='';barA.appendChild(ni);
  var nd=el('div');nd.appendChild(txt('small','','Now playing'));barT=el('b');nd.appendChild(barT);barA.appendChild(nd);
  barB=el('span');barA.appendChild(barB);np.appendChild(barA);document.body.appendChild(np);
  rows[feat.id].classList.add('on');setLink(barA,feat.url);barT.textContent=feat.title;barB.textContent=feat.tag==='Free'?'Book free':'Open';

  /* welcome screen */
  var W=S.welcome;
  if(W&&W.show){
    var w=el('div','wel');w.setAttribute('role','dialog');w.setAttribute('aria-label','Welcome');
    var inn=el('div','in');
    var mini=el('div','mini');var mi=el('img');mi.src=S.photo;mi.alt='';mini.appendChild(mi);inn.appendChild(mini);
    inn.appendChild(txt('small','',W.eyebrow));inn.appendChild(txt('h1','',W.title));
    inn.appendChild(txt('div','t3',S.tagline.join(' ')));
    var wb=el('button','wbtn','<i>'+PLAY+'</i>');wb.type='button';wb.appendChild(txt('span','',W.note));
    inn.appendChild(wb);w.appendChild(inn);document.body.appendChild(w);
    document.documentElement.classList.add('lock');
    function enter(){
      document.documentElement.classList.remove('lock');w.classList.add('out');
      document.body.classList.add('playing');
      setTimeout(function(){if(w.parentNode)w.parentNode.removeChild(w)},700);
    }
    wb.addEventListener('click',enter);
  }else{document.body.classList.add('playing')}
})();
</script>
</body>
</html>
